name: Refresh US Pulse

on:
  schedule:
    # Target 17:35 New York time (after the 16:00 close), Mon-Fri. Two cron entries cover both daylight-saving states:
    # 21:35 UTC is 17:35 EDT, 22:35 UTC is 17:35 EST. The guard step skips whichever run is not after the close.
    # GitHub's scheduler is best-effort (runs can start late or be dropped), so a few retry slots follow in the evening.
    # A repeat run is harmless (same data); the concurrency group stops overlaps. Slots after UTC midnight use
    # day-of-week 2-6 so they map to the same US weekday evening.
    - cron: "35 21 * * 1-5"      # 17:35 EDT / 16:35 EST
    - cron: "35 22 * * 1-5"      # 18:35 EDT / 17:35 EST
    - cron: "5 23 * * 1-5"       # 19:05 EDT / 18:05 EST
    - cron: "35 0 * * 2-6"       # 20:35 EDT / 19:35 EST (previous US weekday)
  workflow_dispatch: {}          # manual run button; no other triggers (no PR / fork input)

concurrency:
  group: refresh
  cancel-in-progress: false

permissions: {}                  # deny by default; each job asks for only what it needs

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write            # only to commit the small data CSV/text files
    env:
      PYTHONUTF8: "1"
    outputs:
      run: ${{ steps.guard.outputs.run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Guard (only after the US close on a trading day; manual runs always go)
        id: guard
        run: python tools/should_run.py "$GITHUB_EVENT_NAME" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        if: steps.guard.outputs.run == 'true'
        run: pip install --no-input -r requirements.txt
      - name: Tests
        if: steps.guard.outputs.run == 'true'
        run: python -m pytest tests -q
      - name: Scan repo for credentials and broker code
        if: steps.guard.outputs.run == 'true'
        run: python tools/scan_repo.py
      - name: Restore price cache
        if: steps.guard.outputs.run == 'true'
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830   # v4
        with:
          path: data/prices.pkl
          key: prices-${{ github.run_id }}
          restore-keys: prices-
      - name: Fetch data and build dashboard
        if: steps.guard.outputs.run == 'true'
        run: python pipeline/run.py
      - name: Stage site
        if: steps.guard.outputs.run == 'true'
        run: |
          mkdir _site
          cp dashboard.html _site/index.html
      # Deliberate exception to "no continue-on-error": a failed push of the data files (for example a branch rule
      # or a race with a human commit) must not block publishing the page. The failure is surfaced as a warning.
      - name: Commit data files
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "uspulse-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "$BRANCH"
          for f in data/sectors.csv data/membership.csv data/last_count.txt; do
            if [ -f "$f" ]; then git add -- "$f"; fi
          done
          git diff --cached --quiet || (git commit -m "Update data files" && (git push || echo "::warning::could not push data files"))
      - name: Upload site
        if: steps.guard.outputs.run == 'true'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3
        with:
          path: _site

  deploy:
    needs: build
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4
